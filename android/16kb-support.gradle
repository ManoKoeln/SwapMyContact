// 16 KB page size support hook
project.afterEvaluate {
    // Set environment variables for all task types that might build native code
    project.tasks.configureEach { task ->
        if (task.name.contains('externalNativeBuild') || 
            task.name.contains('CMake') || 
            task.name.contains('Ndk')) {
            
            if (task.hasProperty('environment')) {
                task.environment.putAll([
                    'LDFLAGS': '-Wl,-z,max-page-size=16384',
                    'CFLAGS': '-Wl,-z,max-page-size=16384',
                    'CXXFLAGS': '-Wl,-z,max-page-size=16384'
                ])
            }
            
            task.doFirst {
                println "Applying 16 KB page size support to: ${task.name}"
            }
        }
    }
}
